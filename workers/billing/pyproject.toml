[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-billing"
version = "0.1.0"
description = "Plans, quotas, and Stripe helpers"
requires-python = ">=3.10"
dependencies = ["httpx==0.27.*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["billing*"]
