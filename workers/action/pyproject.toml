[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-action"
version = "0.1.0"
description = "Fix pipeline: diff validate/apply, sandbox checks, risk, draft PR"
requires-python = ">=3.10"
dependencies = ["httpx==0.27.*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["action*"]
