[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-insights"
version = "0.1.0"
description = "Product insights: feature-request digest from feedback clusters"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["insights*"]
