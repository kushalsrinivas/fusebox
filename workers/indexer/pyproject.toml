[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-indexer"
version = "0.1.0"
description = "Incremental codebase indexer: chunk + embed + local vector search"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["pil_indexer*"]
