[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-graph"
version = "0.1.0"
description = "Product knowledge graph: file-backed nodes/edges + timeline builder"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph*"]
