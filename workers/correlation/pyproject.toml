[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-correlation"
version = "0.1.0"
description = "Deploy-proximity correlation: error spike -> suspect deploys"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["correlation*"]
